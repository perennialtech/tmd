services:
  tml:
    image: ghcr.io/perennialtech/tmd:latest
    platform: linux/amd64
    container_name: tml
    restart: unless-stopped
    environment:
      # Set these to the output of `id -u` and `id -g` on the Linux host.
      TML_UID: "1000"
      TML_GID: "1000"
      UMASK: "0002"
    ports:
      - "7777:7777"
    tty: true
    stdin_open: true
    volumes:
      - ./tModLoader:/tModLoader
